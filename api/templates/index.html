<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth">
      <div class="brand">Bite<span>Voice</span> 🎙️</div>
      <div class="mut">Order food just by talking.</div>
      <div class="tabs">
        <button type="button" id="tab-in" class="active">Sign in</button>
        <button type="button" id="tab-up">Sign up</button>
      </div>
      <form id="form" autocomplete="on">
        <div id="name-wrap" hidden>
          <label for="name" class="mut">Name</label>
          <input id="name" name="name" autocomplete="name" maxlength="120">
        </div>
        <label for="email" class="mut">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password" class="mut">Password (min 8 characters)</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        <div class="err" id="err" role="alert"></div>
        <button type="submit" id="submit">Sign in</button>
      </form>
    </div>
  </div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
